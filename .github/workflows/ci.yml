name: Terraform Task2

on:
  # Автоматический запуск при PR в файлы Task2Advanced
  pull_request:
    paths:
      - 'Task2Advanced/**'
      - '.github/workflows/ci.yml'
  
  # Ручной запуск (для apply)
  workflow_dispatch:

env:
  TF_IN_AUTOMATION: true
  TF_WORKING_DIR: Task2Advanced
  AWS_DEFAULT_REGION: ru-central1

jobs:
  # Выполняется автоматически на каждый PR
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # Инициализация с S3 backend (Yandex Object Storage)
      - name: Terraform init (remote state)
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init -backend-config=backend.hcl

      # Показывает изменения без применения
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: |
          terraform plan -input=false \
            -var "token=${{ secrets.YC_TOKEN }}" \
            -var "cloud_id=${{ secrets.YC_CLOUD_ID }}" \
            -var "folder_id=${{ secrets.YC_FOLDER_ID }}"

  # Выполняется ТОЛЬКО при ручном запуске (workflow_dispatch)
  apply:
    if: github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init (remote state)
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init -backend-config=backend.hcl

      # Apply: применяет изменения (auto-approve для CI)
      - name: Terraform apply (manual)
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
        run: |
          terraform apply -auto-approve -input=false \
            -var "token=${{ secrets.YC_TOKEN }}" \
            -var "cloud_id=${{ secrets.YC_CLOUD_ID }}" \
            -var "folder_id=${{ secrets.YC_FOLDER_ID }}"